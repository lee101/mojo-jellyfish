[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-jellyfish"
version = "0.1.0"
description = "Mojo string-distance and phonetic matching kernels"
requires-python = ">=3.10"
dependencies = ["numpy", "regex"]

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
